# Chief of staff: the settings this bot differs on. Everything else inherits the profile defaults.
model:
  default: "your-frontier-model"       # set this to a model and provider you actually have; see Build 2 of Volume 3
agent:
  reasoning_effort: "high"
  disabled_toolsets: [terminal, code_execution, browser, computer_use, delegation]   # the planner cannot execute, by construction; kanban, memory, file and session_search stay
